<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ritardi Combo</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#e8e8e8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{width:min(92vw,360px);text-align:center}
h1{color:#00ff88;font-size:1.6rem;margin:0 0 1.2rem}
input[type=password]{width:100%;box-sizing:border-box;background:#0b0f0c;color:#e8e8e8;border:1px solid #00ff8855;border-radius:10px;padding:.8rem 1rem;font-size:1rem}
button{margin-top:1rem;background:#00ff88;color:#000;border:0;border-radius:10px;padding:.75rem 1.4rem;font-weight:800;font-size:1rem;cursor:pointer}
label{display:inline-flex;gap:.4rem;align-items:center;margin-top:.9rem;color:#88aa99;font-size:.9rem}
.er{min-height:1.2rem;color:#ff5c5c;font-weight:700;margin-top:.6rem}
</style></head><body>
<form id="pw" onsubmit="go(event)"><h1>Ritardi Combo</h1>
<input type="password" id="pp" placeholder="Password" autocomplete="current-password" autofocus>
<div class="er" id="er"></div>
<label><input type="checkbox" id="rm" checked> ricorda su questo browser</label><br>
<button>Entra</button></form>
<script>
var B="__BLOB__";
function u8(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function dec(p){var d=u8(B),s=d.slice(0,16),iv=d.slice(16,28),ct=d.slice(28);var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:100000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);var gz=u8(new TextDecoder().decode(pt));var txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();return JSON.parse(txt)}
async function open_(p,rem){var D=await dec(p);if(!D||typeof D.html!=="string"||D.html.indexOf("<")<0)throw new Error("vuoto");if(rem)localStorage.setItem("ncpw",p);document.open();document.write(D.html);document.close()}
async function go(e){e.preventDefault();var p=document.getElementById("pp").value;try{await open_(p,document.getElementById("rm").checked)}catch(x){document.getElementById("er").textContent="Password errata"}}
var sp=localStorage.getItem("ncpw");if(sp)open_(sp,true).catch(function(){localStorage.removeItem("ncpw")});
</script></body></html>
