name: Aggiorna ritardi
on:
  # GitHub often delays or drops a cron, especially at minute 0 and 30.
  # Four starts an hour, on quiet minutes: if one is skipped, the next is
  # 15 minutes later. A run still in progress is not cancelled.
  schedule:
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'
      - 'gen.py'
      - 'corner.py'
      - 'corner_multi.py'
      - 'corner_adamchoi.py'
      - 'publish_page.py'
      - 'encrypt_page.py'
      - 'site/**'
      - 'requirements.txt'
permissions:
  contents: read
  pages: write
  id-token: write
# One Pages deployment at a time. A run still in progress is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      esegui: ${{ steps.need.outputs.esegui }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Ripristina la cache privata
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: .cache
        key: newcombo-${{ github.run_id }}
        restore-keys: |
          newcombo-
    - name: Controlla se i dati sono già recenti
      id: need
      run: |
        echo "esegui=true" >> "$GITHUB_OUTPUT"
        if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
          exit 0
        fi
        stamp=".cache/newcombo/published_at"
        if [ ! -f "${stamp}" ]; then
          echo "Nessuna pubblicazione in cache: eseguo l'aggiornamento."
          exit 0
        fi
        last=$(cat "${stamp}" || true)
        if [ -z "${last}" ]; then
          echo "Data dell'ultima pubblicazione sconosciuta: eseguo l'aggiornamento."
          exit 0
        fi
        age=$(( $(date +%s) - last ))
        echo "Ultima pubblicazione: ${age} secondi fa"
        # The generator takes about 15 minutes. Skip only a start that
        # landed while a fresh file is already published.
        if [ "${age}" -lt 600 ]; then
          echo "esegui=false" >> "$GITHUB_OUTPUT"
          echo "Salto: un aggiornamento è appena stato pubblicato."
        fi
    - name: La password è obbligatoria
      if: steps.need.outputs.esegui == 'true'
      env:
        NEWCOMBO_PASS: ${{ secrets.NEWCOMBO_PASS }}
      run: |
        if [ -z "${NEWCOMBO_PASS}" ]; then
          echo "::error::Manca il secret NEWCOMBO_PASS. Aggiungilo in Settings → Secrets and variables → Actions. Senza password l'aggiornamento si ferma e non pubblica dati in chiaro."
          exit 1
        fi
    - uses: actions/setup-python@v5
      if: steps.need.outputs.esegui == 'true'
      with:
        python-version: '3.12'
    - name: Installa le dipendenze
      if: steps.need.outputs.esegui == 'true'
      run: python -m pip install --disable-pip-version-check -r requirements.txt
    - name: Installa il browser, con nuovi tentativi
      if: steps.need.outputs.esegui == 'true'
      run: |
        python -m pip install --disable-pip-version-check playwright || true
        ok=0
        for i in 1 2; do
          if timeout 360 python -m playwright install chromium --with-deps; then
            ok=1
            break
          fi
          echo "Installazione del browser non riuscita, tentativo ${i}"
          sleep $((i * 10))
        done
        if [ "${ok}" -ne 1 ]; then
          echo "Continuo senza browser: i collegamenti restano quelli generici."
        fi
        exit 0
    - name: Conserva la sezione Corner della cache
      if: steps.need.outputs.esegui == 'true'
      run: |
        python3 - << 'PY'
        from pathlib import Path
        src = Path(".cache/newcombo/index.html")
        if not src.exists():
            raise SystemExit(0)
        text = src.read_text(encoding="utf-8")
        start, end = "<!-- CORNER-SECTION -->", "<!-- /CORNER-SECTION -->"
        if start in text and end in text:
            block = text[text.index(start):text.index(end) + len(end)]
            if "Sezione non disponibile in questo aggiornamento." not in block:
                Path("/tmp/corner-section.html").write_text(block, encoding="utf-8")
                print("Sezione Corner precedente conservata")
        PY
    - name: Genera i dati, con nuovi tentativi
      if: steps.need.outputs.esegui == 'true'
      run: |
        ok=0
        for i in 1 2; do
          if python3 gen.py; then
            ok=1
            break
          fi
          echo "Generazione non riuscita, tentativo ${i}"
          sleep $((i * 15))
        done
        if [ "${ok}" -ne 1 ]; then
          exit 1
        fi
    - name: Sezione Corner
      if: steps.need.outputs.esegui == 'true'
      continue-on-error: true
      timeout-minutes: 40
      run: python3 corner_multi.py
    - name: Se Corner fallisce, rimetti la sezione precedente
      if: steps.need.outputs.esegui == 'true'
      run: |
        python3 - << 'PY'
        from pathlib import Path
        page_path, saved = Path("index.html"), Path("/tmp/corner-section.html")
        if not page_path.exists() or not saved.exists():
            raise SystemExit(0)
        page = page_path.read_text(encoding="utf-8")
        start, end = "<!-- CORNER-SECTION -->", "<!-- /CORNER-SECTION -->"
        if "Sezione non disponibile in questo aggiornamento." in page and start in page and end in page:
            old = saved.read_text(encoding="utf-8")
            if "Sezione non disponibile in questo aggiornamento." not in old:
                page = page[:page.index(start)] + old + page[page.index(end) + len(end):]
                page_path.write_text(page, encoding="utf-8")
                print("Sezione Corner precedente ripristinata")
        PY
    - name: Cifra la pagina
      id: publish
      if: steps.need.outputs.esegui == 'true'
      env:
        NEWCOMBO_PASS: ${{ secrets.NEWCOMBO_PASS }}
      run: python3 publish_page.py
    # Saved before the upload so a later deploy failure does not drop the corner cache.
    - name: Ricorda la pagina per il prossimo giro
      if: always() && steps.need.outputs.esegui == 'true' && steps.publish.outcome == 'success'
      run: |
        mkdir -p .cache/newcombo
        cp -a index.html .cache/newcombo/index.html
        date +%s > .cache/newcombo/published_at
    - name: Salva la cache privata
      if: always() && steps.need.outputs.esegui == 'true' && steps.publish.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: .cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - uses: actions/configure-pages@v5
      if: steps.need.outputs.esegui == 'true' && steps.publish.outcome == 'success'
    - uses: actions/upload-pages-artifact@v3
      if: steps.need.outputs.esegui == 'true' && steps.publish.outcome == 'success'
      with:
        path: docs
  # deploy-pages lists artifacts with the results API. That list stays empty
  # until the job that uploaded github-pages has finished, so the same job
  # often reports "No artifacts named github-pages".
  deploy:
    needs: update
    if: needs.update.result == 'success' && needs.update.outputs.esegui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
