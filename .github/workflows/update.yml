name: Aggiorna ritardi
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update.yml'
      - 'gen.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa browser per leggere gli eventi renderizzati
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - run: python3 gen.py
      - name: Salva aggiornamenti
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Aggiornamento automatico ogni 30 minuti" || echo "nessuna modifica"
          git push
